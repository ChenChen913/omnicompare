name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript 类型检查
        run: bunx tsc --noEmit

      - name: 生产构建
        run: bun run build
