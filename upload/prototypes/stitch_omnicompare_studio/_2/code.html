<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudioCompare - 专注模式</title>

                        "outline-variant": "#414755",

                        "secondary-fixed-dim": "#c6c6cb",
                        "surface-variant": "#353534",
                        "inverse-surface": "#e5e2e1",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "on-tertiary": "#571e00",
                        "surface-container-low": "#1c1b1b",

                        "error": "#ffb4ab",

                }
            }
        }

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* Focus mode hiding */
        .focus-hidden {
            display: none !important;
        }

        /* Glassmorphism pane styles */
        .glass-pane {
            background: rgba(28, 27, 27, 0.6); /* surface-container-low approx */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .glass-pane:hover {
            background: rgba(42, 42, 42, 0.7); /* surface-container-high approx */
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        /* Custom minimal scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-body-sm text-body-sm">
<!-- Minimal TopNavBar (Focus Mode) -->
<nav class="fixed top-0 w-full z-50 flex justify-between items-center px-gutter h-16 bg-surface/40 backdrop-blur-xl border-b border-white/5 transition-opacity duration-300 hover:opacity-100 opacity-60">
<!-- Brand -->
<div class="flex items-center gap-4">
<span class="font-display-lg text-title-md font-bold text-on-surface">StudioCompare</span>
<span class="text-on-surface-variant font-mono-label text-mono-label px-2 py-1 rounded bg-surface-container-high/50 border border-white/5 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary-container animate-pulse"></span>
                专注模式
            </span>
</div>
<!-- Minimal Controls -->
<div class="flex items-center gap-unit text-on-surface-variant">
<button class="p-2 rounded-lg hover:bg-surface-container-highest transition-colors duration-200 hover:text-primary" title="退出专注模式">
<span class="material-symbols-outlined text-[20px]" data-weight="fill">fullscreen_exit</span>
</button>
<div class="w-px h-4 bg-white/10 mx-2"></div>
<!-- Actions from JSON, scaled down for focus -->
<button class="p-2 rounded-lg hover:bg-surface-container-highest transition-colors duration-200" title="刷新">
<span class="material-symbols-outlined text-[20px]">refresh</span>
</button>
<button class="p-2 rounded-lg hover:bg-surface-container-highest transition-colors duration-200 text-primary bg-primary/10" title="网格视图">
<span class="material-symbols-outlined text-[20px]">grid_view</span>
</button>
</div>
</nav>
<!-- Main Workspace Area - 2x2 Grid -->
<main class="flex-1 w-full h-full pt-16 p-unit flex flex-col gap-unit">
<!-- Grid Container -->
<div class="grid grid-cols-2 grid-rows-2 gap-unit h-full w-full">
<!-- Panel 1: Video Gen -->
<div class="glass-pane rounded-xl overflow-hidden relative group flex flex-col">
<!-- Status Chip (Hover only in focus mode) -->
<div class="absolute top-4 left-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="font-mono-label text-mono-label text-primary bg-primary/10 backdrop-blur-md px-3 py-1.5 rounded-full border border-primary/20 flex items-center gap-2 shadow-lg">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                        模型 Alpha-V1
                    </span>
</div>
<!-- Content Area -->
<div class="flex-1 w-full h-full bg-black relative">
<img class="w-full h-full object-cover opacity-80" data-alt="A sleek, high-end abstract 3D fluid simulation frozen in time. Deep space background with swirling, luminous nebulas in dark blues and vibrant teals, accented by bright coral pink bioluminescent particles. The lighting is cinematic and dramatic, casting long soft shadows over the glass-like fluid forms. Hyper-realistic render, 8k resolution, maintaining a dark mode, premium studio aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBm1w6Ad3DhFHHlZez3-NMj8ut1DQjSae3PdJ_Zl9tprXh58qv7AnEdMK9E81pBQJf7tiBTHK_HyfY09-7qmtUPEzD34y4J-SfOyYCQYVI5E-aaSpiORzmF4GpNXUOcE8jyE4GJfd-RGhAckE5evITlTSUMfv2LYHwyQCjp2FmDCMbuwfEMRvZ-CIrcQSZDKfTPX7OkEKBEXxslBfWfxsRoVlz47oSL7omKxh-4HHrMsrOOEKm07Hxu"/>
<!-- Overlay Controls (Focus Mode minimal) -->
<div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-surface-container-high/80 backdrop-blur-md rounded-full px-4 py-2 border border-white/10 shadow-lg opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-2 group-hover:translate-y-0">
<button class="text-on-surface hover:text-primary transition-colors"><span class="material-symbols-outlined text-[18px]">play_arrow</span></button>
<div class="w-32 h-1 bg-surface-container-lowest rounded-full overflow-hidden mx-2">
<div class="h-full bg-primary w-1/3 rounded-full"></div>
</div>
<span class="font-mono-label text-mono-label text-on-surface-variant text-[11px]">00:14 / 01:00</span>
</div>
</div>
</div>
<!-- Panel 2: HTML/UI Gen -->
<div class="glass-pane rounded-xl overflow-hidden relative group flex flex-col">
<div class="absolute top-4 left-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="font-mono-label text-mono-label text-tertiary-container bg-tertiary-container/10 backdrop-blur-md px-3 py-1.5 rounded-full border border-tertiary-container/20 flex items-center gap-2 shadow-lg">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary-container animate-ping"></span>
                        WebGen Beta
                    </span>
</div>
<!-- Rendered Output Mockup -->
<div class="flex-1 w-full h-full bg-surface-container p-6 overflow-y-auto">
<div class="max-w-md mx-auto space-y-4">
<div class="h-8 w-48 bg-surface-container-highest rounded animate-pulse"></div>
<div class="h-32 w-full bg-surface-container-highest rounded-lg border border-white/5 flex items-center justify-center">
<span class="material-symbols-outlined text-outline-variant text-4xl">image</span>
</div>
<div class="space-y-2 pt-2">
<div class="h-4 w-full bg-surface-container-highest rounded"></div>
<div class="h-4 w-5/6 bg-surface-container-highest rounded"></div>
<div class="h-4 w-4/6 bg-surface-container-highest rounded"></div>
</div>
<div class="flex gap-2 pt-4">
<div class="h-10 flex-1 bg-primary/20 rounded-lg border border-primary/30"></div>
<div class="h-10 flex-1 bg-surface-container-highest rounded-lg"></div>
</div>
</div>
</div>
</div>
<!-- Panel 3: HTML/UI Gen Alternative -->
<div class="glass-pane rounded-xl overflow-hidden relative group flex flex-col">
<div class="absolute top-4 left-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="font-mono-label text-mono-label text-secondary bg-secondary/10 backdrop-blur-md px-3 py-1.5 rounded-full border border-secondary/20 flex items-center gap-2 shadow-lg">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
                        UI-Builder Stable
                    </span>
</div>
<!-- Rendered Output Mockup -->
<div class="flex-1 w-full h-full bg-[#1a1a1a] p-8 overflow-y-auto border-t border-white/5">
<div class="grid grid-cols-2 gap-4 h-full">
<div class="bg-[#222] rounded-xl border border-white/5 p-4 flex flex-col gap-3">
<div class="w-10 h-10 rounded-full bg-[#333] flex items-center justify-center">
<span class="material-symbols-outlined text-white/50 text-[20px]">person</span>
</div>
<div class="h-3 w-24 bg-[#333] rounded mt-2"></div>
<div class="h-2 w-full bg-[#333] rounded"></div>
<div class="h-2 w-2/3 bg-[#333] rounded"></div>
</div>
<div class="bg-[#222] rounded-xl border border-white/5 p-4 flex flex-col gap-3">
<div class="w-10 h-10 rounded-full bg-[#333] flex items-center justify-center">
<span class="material-symbols-outlined text-white/50 text-[20px]">analytics</span>
</div>
<div class="h-3 w-24 bg-[#333] rounded mt-2"></div>
<div class="h-2 w-full bg-[#333] rounded"></div>
<div class="h-2 w-4/5 bg-[#333] rounded"></div>
</div>
<div class="col-span-2 bg-gradient-to-br from-[#2a2a2a] to-[#222] rounded-xl border border-white/5 p-6 flex flex-col justify-end min-h-[120px]">
<div class="h-8 w-1/3 bg-[#3a3a3a] rounded mb-2"></div>
<div class="h-2 w-1/4 bg-[#333] rounded"></div>
</div>
</div>
</div>
</div>
<!-- Panel 4: Image Gen -->
<div class="glass-pane rounded-xl overflow-hidden relative group flex flex-col">
<div class="absolute top-4 left-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="font-mono-label text-mono-label text-primary bg-primary/10 backdrop-blur-md px-3 py-1.5 rounded-full border border-primary/20 flex items-center gap-2 shadow-lg">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                        Vision Pro X
                    </span>
</div>
<div class="flex-1 w-full h-full bg-black relative">
<img class="w-full h-full object-cover opacity-90 transition-transform duration-700 group-hover:scale-105" data-alt="A highly detailed architectural rendering of a brutalist concrete structure integrated into a lush, dark green tropical jungle environment at twilight. Soft, atmospheric volumetric lighting filters through the dense canopy, casting subtle, moody shadows on the wet concrete surfaces. The scene is shot from a low angle, emphasizing the imposing geometry against the organic surroundings. Dark mode aesthetic, extremely photorealistic, architectural digest style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCmSAjSD7I4caidUAUy8IWY_Uc8uh9mH8wcwhQfc48Ssl1yPSuXoYuKjaHO4w1QxRePJqpHVb05nru_Ja66njzpRxkIjfe8Ml0VaVFiH5lrCDY4YjigLSTRRQ29xpnYBKZfyYxLGetkxVEsOUZxp6EGktvwSIuG7BR0ZNYG3rMhtW1uQWUQQKDD4etxkFIhTpr_QhowiSKsd7zIWv-X2A3cYPAfbgyyfNYUVNqcttzphH8nkjR6d5oe"/>
</div>
</div>
</div>
</main>
</body></html>
