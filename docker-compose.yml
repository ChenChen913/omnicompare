services:
  omnicompare:
    build: .
    image: omnicompare:latest
    container_name: omnicompare
    ports:
      - "3000:3000"
    volumes:
      # 用户数据（上传的视频/HTML 与清单）持久化到宿主机 ./data
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/videos').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
